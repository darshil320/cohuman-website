  toggle_switch:       { source: "derived", note: "Not in Signal. Use a two-cell SegmentedControl (Off / On) with aria-pressed." }
  checkbox_radio:      { source: "derived", note: "Not in Signal. Use SegmentedControl for single choice; a square 16px ink-outlined box with an ink fill for multi-choice if ever needed." }
  slider:              { source: "derived", note: "Not in Signal. Sizes are discrete (read from src/lib/series), so they are SegmentedControl cells, never a slider." }
  date_picker:         { source: "observed", note: "Native input type=date / type=time in the underline field (showroom-visit-form). No custom calendar." }
